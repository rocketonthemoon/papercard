[package]
name = "duelcore"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Labas engine: Lithuanian vocabulary exercises, answer grading, duel scoring and Google sign-in, with a C API for the Mongoose server."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9.3"
ureq = { version = "2.10", features = ["json"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
getrandom = "0.2"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4

[workspace]
