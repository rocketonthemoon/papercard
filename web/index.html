<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokab · Learn words in any language</title>
<meta name="description" content="Learn words in any language in short, game-like lessons: courses by us and by learners, spaced-repetition review, word duels with friends, and a Studio to make your own course.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">

      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="m13.2 13.2 3.3 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="search" id="top-q" placeholder="Search by course, language, creator…" aria-label="Search courses">
    </form>
    <nav class="links" aria-label="Main"></nav>
    <div id="top-chips" class="top-chips"></div>
    <div id="account" class="account"></div>
    <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Theme"></button>

</header>

  <a class="side-brand" href="#/learn" aria-label="Vokab home">

<main id="app" class="app" aria-live="polite">
  <p class="muted loading">Loading…</p>
</main>

<footer class="footer">
  <span>Vocabulary courses for any language, by us and by learners.</span>
  <span>A little every day.</span>
</footer>
