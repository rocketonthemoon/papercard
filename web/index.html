<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="game.css?v=2">

<script>/* Force light theme on Dusk Violet riso stage */ document.documentElement.dataset.theme = "light"; try { localStorage.setItem("theme", "light"); } catch {}</script>

    <a class="brand" href="#/" aria-label="Papercard home">
