<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labas · Learn Lithuanian words</title>
<meta name="description" content="Learn Lithuanian words in short, game-like lessons for English speakers: themed decks from A1 to B1, spaced-repetition review and word duels with friends.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="design.css">
<script>/* Apply the saved theme before the page draws (no flash). */ try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<!-- Shared gradients for the icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe0a6"/><stop offset="1" stop-color="#2fbf80"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset="1" stop-color="#16161a"/></linearGradient>
  </defs>
</svg>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#/" aria-label="Labas home">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2" fill="url(#gGreen)"/><rect x="15" y="1" width="12" height="12" rx="2" fill="url(#gNavy)"/><rect x="1" y="15" width="12" height="12" rx="2" fill="url(#gNavy)"/><rect x="15" y="15" width="12" height="12" rx="2" fill="url(#gGreen)"/></svg>
      <span class="brand-word">LABAS<span>!</span></span>
    </a>
    <h1 class="page-title" id="page-title"></h1>
    <form class="top-search" id="top-search" role="search" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="m13.2 13.2 3.3 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="search" id="top-q" placeholder="Search by course, language, creator…" aria-label="Search courses">
    </form>
    <nav class="links" aria-label="Main"></nav>
    <div id="top-chips" class="top-chips"></div>
    <div id="account" class="account"></div>
    <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Theme"></button>
  </div>
</header>

<aside class="sidebar" id="sidebar" hidden>
  <a class="side-brand" href="#/learn" aria-label="Labas home"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" fill="url(#gGreen)"/><rect x="15" y="1" width="12" height="12" rx="3" fill="url(#gNavy)"/><rect x="1" y="15" width="12" height="12" rx="3" fill="url(#gNavy)"/><rect x="15" y="15" width="12" height="12" rx="3" fill="url(#gGreen)"/></svg></a>
  <nav class="side-links" id="side-links" aria-label="Main"></nav>
  <div class="side-bottom" id="side-bottom"></div>
</aside>

<main id="app" class="app" aria-live="polite">
  <p class="muted loading">Loading…</p>
</main>

<footer class="footer">
  <span>Lithuanian words for English speakers, A1 to B1.</span>
  <span><i lang="lt">Po truputį kiekvieną dieną</i>: a little every day.</span>
</footer>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
