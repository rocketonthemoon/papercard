# Vokab: vocabulary game & language learning platform
# Deploy with Dokploy (Traefik) or docker compose / podman compose
name: vokab

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    image: vokab:latest
    ports:
      - "${PORT:-8080}:8000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ADMINS: ${ADMINS}
      MEMCACHED: memcached:11211
      OFFICIAL_NAME: ${OFFICIAL_NAME}
    volumes:
      - vokab-data:/data
    depends_on:
      - memcached
    restart: unless-stopped

  memcached:
    image: docker.io/library/memcached:1.6-alpine
    command: ["memcached", "-m", "64"]
    restart: unless-stopped

volumes:
  vokab-data:
