# Grammar Duel: run with `podman compose up --build` (or `docker compose up --build`), then open http://localhost:8080
# On a server with a domain: set DOMAIN (and BIND=127.0.0.1) in .env and run
#   podman compose --profile https up -d --build
# to put Caddy in front with automatic HTTPS.
name: grammar-duel

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "${BIND}:${PORT}:8000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ADMINS: ${ADMINS}
      MEMCACHED: memcached:11211
    volumes:
      - duel-data:/data
    depends_on:
      - memcached
    restart: unless-stopped

  memcached:
    image: docker.io/library/memcached:1.6-alpine
    command: ["memcached", "-m", "64"]
    restart: unless-stopped

  # Optional HTTPS front door (only started with --profile https).
  caddy:
    image: docker.io/library/caddy:2-alpine
    profiles: ["https"]
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${HTTPS_PORT}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  duel-data:
  caddy-data:
  caddy-config:
